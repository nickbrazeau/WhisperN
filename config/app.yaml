# Application configuration.
#
# The endpoint below is a loopback address and is validated at runtime:
# src/pipeline/polisher.py refuses any non-loopback host, and refuses
# hostnames outright because resolution can change.

transcription:
  engine: whisper_cpp
  model: large-v3-turbo
  language: en
  local_only: true
  cloud_fallback: false
  save_audio: false
  save_transcripts: false
  initial_prompt_enabled: true
  # Specialty whose `prompt` dictionaries build the Whisper initial prompt.
  # Budget is 224 tokens (n_text_ctx/2); roughly 16 terms fit.
  specialty: infectious_diseases

polishing:
  # DISABLED pending user approval of a model.
  #
  # qwen2.5:14b passes 21/21 with send_glossary: false, reproduced across two
  # runs, and is a defensible approval candidate. It is not enabled here
  # because approving a model that rewrites clinical text is the user's
  # decision. See docs/phase3-results.md section 5a for latency and memory
  # caveats: 9.1 GB resident on a 16 GB machine, ~4.4 s per utterance.
  #
  # llama3.1:8b is REJECTED: 14/17 without the glossary, 11/17 with it,
  # failing every ambiguous-abbreviation case in both configurations. It
  # expanded "MS" to "methicillin-sensitive Staphylococcus aureus (MS)",
  # inserting a fabricated infection into the record.
  #
  # Do not enable a model until it passes scripts/eval_polisher.py with zero
  # failures, and do not relax the cases to get there (CLAUDE.md 9).
  enabled: false

  provider: local
  endpoint: http://127.0.0.1:11434
  # Candidate, pending approval: qwen2.5:14b (21/21)
  model: REPLACE_WITH_APPROVED_LOCAL_MODEL
  temperature: 0
  mode: clinical_strict
  timeout_seconds: 20
  retries: 0
  cloud_fallback: false

  # Whether to send the specialty glossary with the transcript.
  #
  # Measured to make BOTH tested models worse, by the same mechanism:
  #   llama3.1:8b  82.4% -> 64.7%
  #   qwen2.5:14b  100%  -> 88.2%
  # The glossary induces "correction" toward nearby approved terms. It turned
  # "no evidence of endocarditis" into "no evidence of infective endocarditis"
  # and "PCP" into "Pneumocystis jirovecii pneumonia (PCP)".
  #
  # Replicated across two model families and sizes, so this is unlikely to be
  # model-specific -- but re-measure when adding a model rather than assuming.
  send_glossary: false

validation:
  protect_negation: true
  protect_numbers: true
  protect_units: true
  protect_dates: true
  protect_laterality: true
  protect_medications: true
  protect_organisms: true
  protect_uncertainty: true
  require_review_on_protected_change: true

storage:
  temporary_directory: runtime/tmp
  delete_temporary_audio: true
  transcript_history: false
  prompt_logging: false
  response_logging: false
