# Application configuration.
#
# The endpoint below is a loopback address and is validated at runtime:
# src/pipeline/polisher.py refuses any non-loopback host, and refuses
# hostnames outright because resolution can change.

recording:
  # Which microphone to record from. Resolved BY NAME at record time, never by
  # a cached avfoundation index: indices are positional and renumber whenever a
  # device connects. Hardcoding index 0 previously selected the Microsoft Teams
  # virtual driver, which captures digital silence (-91 dB).
  #
  # headset: prefer an external mic (headset, USB) over the built-in one.
  # builtin: the reverse.
  #
  # Caveat for `headset` with Bluetooth: the microphone is negotiated over HFP
  # at 16 kHz narrowband, a compressed voice codec rather than a clean
  # downsample, and it forces the headset out of A2DP while recording. It wins
  # on proximity and room noise, and loses on codec quality. Unmeasured against
  # this corpus -- see docs/deployment.md §6.4.
  prefer_microphone: headset

  # Pause Spotify and Music.app while recording, and resume exactly those that
  # were playing. Never starts a player that was not already playing, and never
  # launches one that is not running.
  pause_music: true

transcription:
  engine: whisper_cpp
  model: large-v3-turbo
  language: en
  local_only: true
  cloud_fallback: false
  save_audio: false
  save_transcripts: false
  initial_prompt_enabled: true
  # Specialty whose `prompt` dictionaries build the Whisper initial prompt.
  # Budget is 224 tokens (n_text_ctx/2); roughly 16 terms fit.
  specialty: infectious_diseases

  # Voice-activity gate. Runs the VAD model BEFORE transcription and skips the
  # model entirely when no speech segment is found.
  #
  # Necessary because Whisper invents text from non-speech: digital silence
  # transcribes as "you", room tone as "-". Nothing downstream can catch that,
  # since the validator treats the raw transcript as its reference.
  #
  # Used as a gate, never as a filter. whisper-cli's own --vad flag trims audio
  # to the detected segments, which costs accuracy: content WER 13.68% ->
  # 15.31%, and piperacillin-tazobactam degraded to "pipercyllum-tazoza-bactam".
  # Padding barely helped (14.98% at 400 ms). Gating and then transcribing the
  # untrimmed audio keeps the protection at no accuracy cost.
  #
  # Measured: 33/33 real utterances pass the gate, 2/2 non-speech rejected,
  # ~79 ms per utterance.
  vad_gate: true

polishing:
  # DISABLED. Decision taken 2026-07-27; see
  # docs/decisions/0001-defer-local-polishing-model.md
  #
  # qwen2.5:14b passes 21/21 with send_glossary: false, reproduced across two
  # runs, and was NOT adopted -- 9.1 GB resident on a 16 GB machine, ~4.4 s per
  # utterance, and the polisher adds tidying rather than safety. The validator
  # carries the safety properties and runs regardless.
  #
  # The evaluation is archived, not discarded. To revisit, read that ADR.
  #
  # llama3.1:8b is REJECTED: 14/17 without the glossary, 11/17 with it,
  # failing every ambiguous-abbreviation case in both configurations. It
  # expanded "MS" to "methicillin-sensitive Staphylococcus aureus (MS)",
  # inserting a fabricated infection into the record.
  #
  # Do not enable a model until it passes scripts/eval_polisher.py with zero
  # failures, and do not relax the cases to get there (CLAUDE.md 9).
  enabled: false

  provider: local
  endpoint: http://127.0.0.1:11434
  # Evaluated and deferred: qwen2.5:14b (21/21) -- see ADR 0001
  model: REPLACE_WITH_APPROVED_LOCAL_MODEL
  temperature: 0
  # `medical`, not `clinical_strict`, by owner decision 2026-10-07: warnings
  # alone (e.g. an unrecognised word) no longer block auto-paste. Protected
  # changes and drug-like words outside the vocabulary still require review.
  mode: medical
  timeout_seconds: 20
  retries: 0
  cloud_fallback: false

  # Whether to send the specialty glossary with the transcript.
  #
  # Measured to make BOTH tested models worse, by the same mechanism:
  #   llama3.1:8b  82.4% -> 64.7%
  #   qwen2.5:14b  100%  -> 88.2%
  # The glossary induces "correction" toward nearby approved terms. It turned
  # "no evidence of endocarditis" into "no evidence of infective endocarditis"
  # and "PCP" into "Pneumocystis jirovecii pneumonia (PCP)".
  #
  # Replicated across two model families and sizes, so this is unlikely to be
  # model-specific -- but re-measure when adding a model rather than assuming.
  send_glossary: false

rewrite:
  # Email/research rewrite mode -- ADR 0002, decided 2026-10-07.
  #
  # Turns rambling dictation into concise, professional prose. SEPARATE from
  # `polishing` above, which stays disabled: that is the constrained clinical
  # editor, and this is a free rewrite whose wording changes by design.
  #
  #   scope    email and research dictation only. Never clinical notes or
  #            patient data (owner decision, ADR 0002).
  #   review   every rewrite needs an explicit click to paste. There is no
  #            auto-paste path for a rewrite, whatever auto-paste is set to.
  #   check    src/validation/validator.py validate_rewrite: protected facts
  #            (negation, numbers, dates, hedging, laterality...) and new
  #            names are compared, and the raw transcript is shown alongside.
  #
  # Ollama runs from scripts/setup_ollama.sh: loopback only, OLLAMA_NO_CLOUD=1.
  enabled: true
  # The app starts in Raw on every launch; switch to Rewrite per session.
  # Rewrite mode's scope depends on the user choosing it, so the default is
  # the mode that is safe for everything, clinical notes included.
  default_on: false
  endpoint: http://127.0.0.1:11434
  model: qwen2.5:14b
  temperature: 0
  # Generous because a long ramble produces a long rewrite, and a model
  # loaded cold costs several seconds before the first token.
  timeout_seconds: 90
  keep_alive: 30m
  cloud_fallback: false

validation:
  protect_negation: true
  protect_numbers: true
  protect_units: true
  protect_dates: true
  protect_laterality: true
  protect_medications: true
  protect_organisms: true
  protect_uncertainty: true
  require_review_on_protected_change: true

storage:
  temporary_directory: runtime/tmp
  delete_temporary_audio: true
  transcript_history: false
  prompt_logging: false
  response_logging: false
