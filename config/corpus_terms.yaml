# Term bank for generating a real-voice evaluation corpus.
#
# WHY THIS FILE EXISTS, and why it is not `dictionaries/medications.txt`.
#
# That file is the FDA National Drug Code directory: 13,789 entries, most of
# them homeopathic Latin ("aconiticum acidum", "niccolum carbonicum"). Sampling
# it uniformly would measure how well Whisper transcribes homeopathy, not how
# well it transcribes the drugs an infectious-diseases clinician actually says.
# The same applies to the 7,590 NCBI organism binomials.
#
# So the corpus samples from this curated list instead. It is deliberately
# small enough to read in one sitting and disagree with.
#
# THIS IS NOT AN ASR DICTIONARY. Nothing here is fed to Whisper's initial
# prompt or to the validator. It exists only to build phrases to read aloud.
# Keeping it separate from `dictionaries/` is the point: a term added here
# changes what gets *measured*, and a term added there changes what the system
# *does*. Conflating them would let a benchmark quietly tune its own answer.
#
# Contains no patient information, no institution names, and no identifiers.
# Every phrase built from it is constructed (CLAUDE.md 3.1).
#
# Review before use (CLAUDE.md 8): the point of measuring named-entity accuracy
# is to learn the rate on terms YOU say. Cut what you never say, add what you
# say daily. A term you never use is a wasted recording.

