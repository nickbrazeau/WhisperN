# ---------------------------------------------------------------- grammar
#
# Numbers are spelled out because that is the convention the existing corpora
# use, and scripts/score_transcripts.py maps spelled forms to digits before
# comparing. Writing "2" here would not be wrong, but it would be inconsistent
# with corpus_prompted2 and heldout_syn.

doses:
  - one gram
  - two grams
  - four hundred milligrams
  - five hundred milligrams
  - six hundred milligrams
  - seven hundred fifty milligrams
  - one hundred milligrams
  - twelve point five milligrams per kilogram

# Deliberately only the two routes that dominate infectious-diseases
# dictation. Adding "topically" or "intramuscularly" let the generator emit
# topical meropenem, and a phrase no clinician would ever say is a phrase
# Whisper's language model has never seen in context -- which measures the
# corpus, not the system.
routes:
  - intravenously
  - orally

frequencies:
  - daily
  - twice daily
  - three times daily
  - every six hours
  - every eight hours
  - every twelve hours
  - every twenty-four hours

durations:
  - seven days
  - ten days
  - fourteen days
  - twenty-one days
  - six weeks
  - three months

lab_values:
  - a creatinine of one point four
  - a white count of eighteen point two
  - a lactate of three point one
  - a procalcitonin of zero point eight
  - a temperature of thirty-eight point two degrees Celsius
  - an erythrocyte sedimentation rate of eighty-four
